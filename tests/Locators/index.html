<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test ID Demo</title>
</head>
<body>

    <h1>Playwright `getByTestId` Example</h1>

    <button data-testid="login-button">Log In</button>

    <div data-testid="status-message">Please log in to continue.</div>

    <p class="ignore-me">This text will be ignored by the test.</p>

    <input type="email" placeholder="Enter Email" data-testid="email-input"/>

</body>
</html>
